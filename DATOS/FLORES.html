<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floricienta</title>
    <link rel="stylesheet" href="DATOS/css/style.css">
    <link rel="icon" href="DATOS/img/flowers.png" type="image/x-icon">
</head>
<body>
    <div class="girasoles">
        <!-- Contenido principal o girasoles -->
    </div>

    <!-- Audio con ruta relativa limpia -->
    <audio id="musica" src="DATOS/img/Floricienta.mp3" loop></audio>

    <script src="DATOS/js/app.js"></script>
    <script>
      // Control de reproducción de audio para navegadores modernos
      window.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('musica');
        
        // Intentar reproducción automática
        const playPromise = audio.play();

        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Si el navegador bloquea el autoplay, reproduce al primer clic o toque
            const activarAudio = () => {
              audio.play();
              document.removeEventListener('click', activarAudio);
              document.removeEventListener('touchstart', activarAudio);
            };
            document.addEventListener('click', activarAudio);
            document.addEventListener('touchstart', activarAudio);
          });
        }
      });
    </script>
</body>
</html>
